name: Python spectroscopy

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-spectra.yaml"
      - "R/snv.R"
      - "R/msc.R"
      - "R/savitzky_golay.R"
      - "R/helpers.R"
      - "R/measure-class.R"
      - "R/axis-validation.R"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-spectra.yaml"
      - "R/snv.R"
      - "R/msc.R"
      - "R/savitzky_golay.R"
      - "R/helpers.R"
      - "R/measure-class.R"
      - "R/axis-validation.R"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './python[test]' ruff
      - run: |
          ruff check python
          ruff format --check python
      - run: python -m pytest python/tests
      - uses: r-lib/actions/setup-r@v2
        if: matrix.python == '3.13'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.python == '3.13'
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::prospectr
            any::pkgload
      - name: Compare with results generated by R Measure
        if: matrix.python == '3.13'
        run: |
          Rscript python/tests/fixtures/generate_parity_fixture.R
          git diff --exit-code python/tests/fixtures/spectra_parity.json
          python -m pytest python/tests/test_r_parity.py
