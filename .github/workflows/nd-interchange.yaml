on:
  push:
    branches: [main, master]
  pull_request:

name: Native nD interchange

permissions:
  contents: read

jobs:
  nd-interchange:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install the checked-out candidate
        run: R CMD INSTALL .
      - name: Verify public R and independent Python interchange
        run: |
          python3 --version
          Rscript tools/nd-interchange/qualify.R produce "$RUNNER_TEMP/nd-interchange"
          python3 tools/nd-interchange/verify.py "$RUNNER_TEMP/nd-interchange"
          python3 tools/nd-interchange/mutate.py "$RUNNER_TEMP/nd-interchange"
          Rscript tools/nd-interchange/qualify.R reject "$RUNNER_TEMP/nd-interchange"
          python3 tools/nd-interchange/verify.py "$RUNNER_TEMP/nd-interchange" --rejections
      - name: Verify tools copied outside the checkout to a path containing spaces
        run: |
          mkdir "$RUNNER_TEMP/qualification tools"
          cp -R tools/nd-interchange "$RUNNER_TEMP/qualification tools/nd-interchange"
          cd "$RUNNER_TEMP"
          Rscript "$RUNNER_TEMP/qualification tools/nd-interchange/qualify.R" produce "$RUNNER_TEMP/nd interchange copied"
          python3 "$RUNNER_TEMP/qualification tools/nd-interchange/verify.py" "$RUNNER_TEMP/nd interchange copied"
          python3 "$RUNNER_TEMP/qualification tools/nd-interchange/mutate.py" "$RUNNER_TEMP/nd interchange copied"
          Rscript "$RUNNER_TEMP/qualification tools/nd-interchange/qualify.R" reject "$RUNNER_TEMP/nd interchange copied"
          python3 "$RUNNER_TEMP/qualification tools/nd-interchange/verify.py" "$RUNNER_TEMP/nd interchange copied" --rejections
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nd-interchange-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nd-interchange
            ${{ runner.temp }}/nd interchange copied
          if-no-files-found: ignore
