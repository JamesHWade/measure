on:
  push:
    branches: [main, master]
  pull_request:

name: Record interchange

permissions:
  contents: read

jobs:
  record-interchange:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install the checked-out candidate
        run: R CMD INSTALL .

      - name: Verify public R and independent Python interchange
        run: |
          python3 --version
          Rscript tools/record-interchange/qualify.R produce "$RUNNER_TEMP/record-interchange"
          python3 tools/record-interchange/verify.py "$RUNNER_TEMP/record-interchange"
          python3 tools/record-interchange/mutate.py "$RUNNER_TEMP/record-interchange"
          Rscript tools/record-interchange/qualify.R reject "$RUNNER_TEMP/record-interchange"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-interchange-${{ github.sha }}
          path: ${{ runner.temp }}/record-interchange
          if-no-files-found: ignore
